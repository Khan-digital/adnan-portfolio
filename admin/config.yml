backend:
  name: github
  repo: Khan-digital/adnan-portfolio
  branch: main

media_folder: images
public_folder: /images

collections:
  - name: projects
    label: Projects
    label_singular: Project
    file: content/projects.json
    fields:
      - name: title
        label: Project Title
        widget: string

      - name: description
        label: Short Description
        widget: text

      - name: image
        label: Cover Image
        widget: image
        required: false

      - name: role
        label: Role
        widget: string
        required: false

      - name: year
        label: Year
        widget: string
        required: false

      - name: body
        label: Case Study
        widget: markdown
